<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">{{robots}}
  <meta name="author" content="Mangalam Jewellers">
  <meta name="theme-color" content="#2E0A16">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Mangalam Jewellers">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image" content="assets/images/brand/mangalam-logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/images/brand/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&amp;family=Jost:wght@300;400;500;600&amp;family=Noto+Serif+Gujarati:wght@400;500&amp;display=swap">
  <link rel="stylesheet" href="assets/css/mangalam.css?v={{cssVersion}}">
  <!-- "View in 3D" on product pages: three.js and the viewer load only when a visitor opens it -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
        "mangalam/viewer3d": "./assets/js/viewer3d.js?v={{viewerVersion}}",
        "mangalam/product3d": "./assets/js/product3d.js?v={{product3dVersion}}"
      },
      "integrity": {
        "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js": "sha384-qOubuRxWZ0I7rXTjcuhcKNHKvPM7q0ztN8/82sJnxnyKS0OXTeB5FsIcysc2T9EY",
        "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/controls/OrbitControls.js": "sha384-aJoe4qqS/DgF2jh9njAuvA6QIveJYoCuYOfYjdFY8P3eawzmc9bEQ40jq2TvOyuP",
        "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/loaders/GLTFLoader.js": "sha384-VoIGt4hjsBN2DcfqRsMnLLSUBl1bpLaVmkZ4MO/qESaCNDuISU6ScEtXt1/j3IyF",
        "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/utils/BufferGeometryUtils.js": "sha384-wOjwauvHlJO7K6APr7FmMGH2nupQa3Ndzas9bJZhsAMOK055efJud8ns4aYmASKv"
      }
    }
  </script>
  <script>document.documentElement.classList.add("js"); try { if (sessionStorage.getItem("mj-loaded")) document.documentElement.classList.add("mj-seen"); } catch (e) {}</script>
  <noscript><style>.header { background: #2E0A16; }</style></noscript>
</head>
<body data-page="{{page}}"{{bodyAttrs}}>
{{loader}}
  <div class="scroll-progress" data-progress aria-hidden="true"></div>
  <a class="skip-link" href="#main">Skip to content</a>
{{> header}}

  <main id="main">
{{main}}
  </main>

{{> footer}}

{{> modals}}
{{extraModals}}
{{offer}}

  <button type="button" class="to-top" data-to-top aria-label="Back to top">
    <svg class="to-top__ring" viewBox="0 0 54 54" aria-hidden="true"><circle class="track" cx="27" cy="27" r="24"/><circle class="bar" cx="27" cy="27" r="24"/></svg>
    {{icon:arrow-up}}
  </button>

  <script src="assets/js/ui.js?v={{uiVersion}}"></script>
  <script src="data.js?v={{dataVersion}}"></script>
  <script src="assets/js/main.js?v={{jsVersion}}"></script>
</body>
</html>
