<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{storeName}} — back soon</title>
  <meta name="theme-color" content="#2E0A16">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/images/brand/apple-touch-icon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&amp;family=Jost:wght@300;400;500&amp;display=swap">
  <link rel="stylesheet" href="assets/css/mangalam.css">
</head>
<body data-page="maintenance">
  <main id="main">
    <section class="notfound">
      <div>
        <span class="brand-emblem" aria-hidden="true"></span>
        <h1>We will be back shortly</h1>
        <p>{{message}}</p>
        <div class="cta-final__actions">
          <a class="btn btn--gold" href="{{phoneHref}}">{{icon:phone}} {{phone}}</a>
          <a class="btn btn--light" href="mailto:{{email}}">{{icon:mail}} {{email}}</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
