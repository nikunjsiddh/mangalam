  <!-- Your own name, email and password -->
  <dialog class="dialog" id="profile-dialog" aria-labelledby="profile-title">
    <form class="dialog__panel" data-save="profile.save" data-toast="Profile saved">
      <header class="dialog__head">
        <div><p class="dialog__eyebrow">Your profile</p><h2 class="dialog__title" id="profile-title">{{meName}}</h2></div>
        <button type="button" class="icon-btn" data-dialog-close aria-label="Close">{{icon:x}}</button>
      </header>
      <div class="dialog__body stack">
        <div class="form-grid">
          <label class="field"><span class="field__label">Name</span><input class="input" name="name" value="{{meName}}" required autocomplete="name"></label>
          <label class="field"><span class="field__label">Email</span><input class="input" type="email" name="email" value="{{meEmail}}" required autocomplete="username"></label>
        </div>
        <fieldset class="fieldset">
          <legend>Change your password</legend>
          <label class="field"><span class="field__label">Current password</span><input class="input" type="password" name="current" autocomplete="current-password"><span class="hint">Needed to change your email or password.</span></label>
          <label class="field"><span class="field__label">New password</span><input class="input" type="password" name="password" minlength="8" autocomplete="new-password"><span class="hint">At least 8 characters. Leave empty to keep your password.</span></label>
        </fieldset>
      </div>
      <footer class="dialog__foot">
        <button type="button" class="btn btn--outline" data-dialog-close>Cancel</button>
        <button type="submit" class="btn btn--primary">{{icon:check}} Save</button>
      </footer>
    </form>
  </dialog>
